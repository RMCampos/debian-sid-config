Section "Monitor"
    Identifier     "HDMI-1"
    Option         "Primary" "true"
EndSection

Section "Device"
    Identifier     "Intel Graphics"
    Driver         "intel"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Intel Graphics"
    Monitor        "HDMI-1"
    DefaultDepth   24
    SubSection     "Display"
        Depth       24
        Modes      "1920x1080"
    EndSubSection
EndSection

