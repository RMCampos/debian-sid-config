backend = "glx";
vsync = true;
shadow = true;
#shadow-radius = 12;
#shadow-offset-x = -8;
#shadow-offset-y = -8;
#shadow-opacity = 0.2;

fading = true;
fade-delta = 5;               # Lower = slower/smoother (try 3–10)
fade-in-step = 0.03;          # Fine tune for smoothness
fade-out-step = 0.03;

# Fade on window switch
fade-exclude = [];

# Optional: fade windows during opacity change
mark-wmwin-focused = true;
mark-ovredir-focused = true;

# Fade inactive windows
inactive-opacity = 0.95;
active-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Tint2'",
];

corner-radius = 3;
round-borders = 1;
#blur-background = false

use-ewmh-active-win = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

## additional
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'notify-osd'",
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
